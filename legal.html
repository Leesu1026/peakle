 privacy:{t:"Datenschutzerklärung", intro:"Peakle („das Spiel“) ist ein kostenloses Webspiel eines unabhängigen Entwicklers. Diese Erklärung beschreibt, welche Daten das Spiel nutzt und warum.", s:[
  ["Welche Daten wir erheben",["Den von dir gewählten Spitznamen","Eine anonyme Konto-ID, die pro Gerät automatisch erstellt wird (Google Firebase Authentication)","Anmeldedaten, falls du ein Passwort festlegst — das Passwort speichert Google verschlüsselt; wir können es nie sehen","Spielstatistik (Duellergebnisse, tägliche Punktzahlen)","Vorübergehende Daten von Duellräumen (nach dem Spiel gelöscht)","Nur auf deinem Gerät gespeicherte Einstellungen (Sprache, Einheit, Ton, täglicher Fortschritt)"]],
  ["Was wir nicht erheben","Wir erheben weder Namen noch E-Mail-Adresse, Telefonnummer oder Standort."],
  ["Wozu wir die Daten nutzen","Nur um Spitznamen eindeutig zu halten, 1-gegen-1-Duelle durchzuführen, deine Statistik zu speichern und auf anderen Geräten fortzusetzen sowie Betrug zu verhindern."],
  ["Dienste Dritter",["Google Firebase: Server, Anmeldung und Datenspeicherung (<a href='"+FIREBASE_PRIVACY+"'>Firebase-Datenschutz</a>)","Wikimedia Commons: Beim Laden von Bildern von Wikimedia-Servern können diese deine Verbindungsdaten (IP-Adresse) erhalten","Werbung (sobald aktiviert): Google und andere Werbepartner können Cookies verwenden, um Anzeigen zu zeigen (<a href='"+GOOGLE_ADS_POLICY+"'>wie Google Daten nutzt</a>). Besucher aus EWR, Großbritannien und der Schweiz werden vorher um Einwilligung gebeten. Personalisierte Werbung kannst du in den <a href='"+ADS_SETTINGS+"'>Google-Anzeigeneinstellungen</a> abschalten","Statistik (sobald aktiviert): nur Besucherzahlen über das cookiefreie Cloudflare Web Analytics"]],
  ["Speicherdauer und Löschung","Spitznamen und Statistik bleiben gespeichert, solange du das Spiel nutzt. Für eine Löschung schicke uns deinen Spitznamen über den Kontakt unten. Einstellungen auf dem Gerät verschwinden, wenn du die Browserdaten löschst."],
  ["Kinder","Das Spiel richtet sich nicht an Kinder unter 13 Jahren, und wir erheben wissentlich keine personenbezogenen Daten von ihnen."],
  ["Änderungen","Ändert sich diese Erklärung, veröffentlichen wir sie hier mit neuem Datum."]]},
 terms:{t:"Nutzungsbedingungen", intro:"Mit der Nutzung des Spiels stimmst du Folgendem zu.", s:[
  ["Der Dienst","Peakle wird kostenlos und „wie besehen“ angeboten. Funktionen können sich ohne Ankündigung ändern oder eingestellt werden."],
  ["Deine Pflichten",["Gib dich nicht als andere aus und nutze keine Spitznamen mit Beleidigungen oder Hassrede","Nutze keine Fehler aus, greife keine Server an und spiele nicht mit Bots oder Skripten","Greife nicht in Konten oder Statistiken anderer Spieler ein","Bei Verstößen können Spitzname und Statistik gelöscht werden"]],
  ["Bilder und Daten","Die Bilder sind frei lizenzierte Aufnahmen aus Wikimedia Commons; Urheber und Lizenz werden nach jeder Antwort und auf der Seite Bildnachweise angezeigt. Die Höhen beruhen auf öffentlichen Quellen, können aber Fehler enthalten."],
  ["Haftungsbeschränkung","Soweit gesetzlich zulässig, haftet der Betreiber nicht für Schäden aus der Nutzung des Spiels."],
  ["Änderungen","Ändern sich diese Bedingungen, veröffentlichen wir sie hier mit neuem Datum."]]},
 contact:{t:"Kontakt", intro:"Fehlermeldungen, Löschanfragen oder Kooperationsanfragen bitte hierüber.", btn:"Nachricht auf GitHub hinterlassen", mail:"E-Mail: "}},

fr:{nav:["Confidentialité","Conditions","Contact","Crédits photo","Retour au jeu"], upd:"En vigueur le : 19 octobre 2026",
 privacy:{t:"Politique de confidentialité", intro:"Peakle (« le jeu ») est un jeu web gratuit géré par un développeur indépendant. Cette politique explique quelles informations le jeu utilise et pourquoi.", s:[
  ["Ce que nous collectons",["Le pseudo que vous choisissez","Un identifiant de compte anonyme créé automatiquement pour chaque appareil (Google Firebase Authentication)","Les informations de connexion si vous définissez un mot de passe — Google le conserve chiffré et nous ne pouvons jamais le voir","Les données de jeu (résultats des duels, scores quotidiens)","Les données temporaires des salons de duel (supprimées après la partie)","Les réglages enregistrés uniquement sur votre appareil (langue, unité, son, progression du défi)"]],
  ["Ce que nous ne collectons pas","Nous ne collectons ni votre nom, ni votre adresse e-mail, ni votre numéro de téléphone, ni votre position."],
  ["Pourquoi nous les utilisons","Uniquement pour garder des pseudos uniques, organiser les duels 1 contre 1, enregistrer vos statistiques et les retrouver sur un autre appareil, et empêcher la triche."],
  ["Services tiers",["Google Firebase : serveurs, connexion et stockage (<a href='"+FIREBASE_PRIVACY+"'>confidentialité Firebase</a>)","Wikimedia Commons : lors du chargement des photos depuis ses serveurs, Wikimedia peut recevoir vos informations de connexion (adresse IP)","Publicité (une fois activée) : Google et d'autres partenaires peuvent utiliser des cookies pour afficher des annonces (<a href='"+GOOGLE_ADS_POLICY+"'>comment Google utilise les données</a>). Dans l'EEE, au Royaume-Uni et en Suisse, votre consentement est demandé d'abord. Vous pouvez désactiver les annonces personnalisées dans les <a href='"+ADS_SETTINGS+"'>Paramètres des annonces Google</a>","Statistiques (une fois activées) : nombre de visites uniquement, via Cloudflare Web Analytics sans cookies"]],
  ["Conservation et suppression","Les pseudos et statistiques sont conservés tant que vous utilisez le jeu. Pour les faire supprimer, envoyez-nous votre pseudo via le contact ci-dessous. Les réglages de l'appareil disparaissent si vous effacez les données du navigateur."],
  ["Enfants","Le jeu ne s'adresse pas aux enfants de moins de 13 ans et nous ne collectons pas sciemment leurs données personnelles."],
  ["Modifications","Si cette politique change, nous publierons la mise à jour ici avec une nouvelle date."]]},
 terms:{t:"Conditions d'utilisation", intro:"En utilisant le jeu, vous acceptez ce qui suit.", s:[
  ["Le service","Peakle est fourni gratuitement et « tel quel ». Les fonctions peuvent changer ou s'arrêter sans préavis."],
  ["Vos engagements",["Ne pas usurper l'identité d'autrui ni utiliser de pseudos injurieux ou haineux","Ne pas exploiter de bugs, attaquer les serveurs ni jouer avec des bots ou scripts","Ne pas toucher aux comptes ou statistiques des autres joueurs","Tout manquement peut entraîner la suppression de votre pseudo et de vos statistiques"]],
  ["Photos et données","Les photos sont des images sous licence libre de Wikimedia Commons ; l'auteur et la licence sont affichés après chaque réponse et sur la page Crédits photo. Les hauteurs proviennent de sources publiques mais peuvent comporter des erreurs."],
  ["Limitation de responsabilité","Dans la mesure permise par la loi, l'exploitant n'est pas responsable des dommages liés à l'utilisation du jeu."],
  ["Modifications","Si ces conditions changent, nous publierons la mise à jour ici avec une nouvelle date."]]},
 contact:{t:"Contact", intro:"Pour signaler un bug, demander la suppression de données ou proposer un partenariat, contactez-nous ici.", btn:"Laisser un message sur GitHub", mail:"E-mail : "}},

it:{nav:["Privacy","Termini","Contatti","Crediti foto","Torna al gioco"], upd:"In vigore dal: 19 ottobre 2026",
 privacy:{t:"Informativa sulla privacy", intro:"Peakle (“il gioco”) è un gioco web gratuito gestito da uno sviluppatore indipendente. Questa informativa spiega quali dati usa il gioco e perché.", s:[
  ["Dati raccolti",["Il nickname che scegli","Un ID account anonimo creato automaticamente per ogni dispositivo (Google Firebase Authentication)","I dati di accesso se imposti una password — Google la conserva cifrata e noi non possiamo mai vederla","I dati di gioco (risultati dei duelli, punteggi giornalieri)","Dati temporanei delle stanze di duello (cancellati a fine partita)","Impostazioni salvate solo sul tuo dispositivo (lingua, unità, suono, progressi della sfida)"]],
  ["Dati non raccolti","Non raccogliamo nome, indirizzo e-mail, numero di telefono né posizione."],
  ["Perché li usiamo","Solo per mantenere unici i nickname, gestire i duelli 1 contro 1, salvare i tuoi dati e ritrovarli su un altro dispositivo, e prevenire imbrogli."],
  ["Servizi di terze parti",["Google Firebase: server, accesso e archiviazione (<a href='"+FIREBASE_PRIVACY+"'>privacy di Firebase</a>)","Wikimedia Commons: quando le foto vengono caricate dai server Wikimedia, questi possono ricevere i tuoi dati di connessione (indirizzo IP)","Pubblicità (quando attiva): Google e altri partner possono usare cookie per mostrare annunci (<a href='"+GOOGLE_ADS_POLICY+"'>come Google usa i dati</a>). Nel SEE, nel Regno Unito e in Svizzera chiediamo prima il consenso. Puoi disattivare gli annunci personalizzati nelle <a href='"+ADS_SETTINGS+"'>Impostazioni annunci di Google</a>","Statistiche (quando attive): solo il numero di visite, con Cloudflare Web Analytics senza cookie"]],
  ["Conservazione e cancellazione","Nickname e dati restano finché usi il gioco. Per cancellarli, inviaci il tuo nickname tramite i contatti qui sotto. Le impostazioni sul dispositivo si cancellano svuotando i dati del browser."],
  ["Minori","Il gioco non è rivolto ai minori di 13 anni e non raccogliamo consapevolmente i loro dati personali."],
  ["Modifiche","Se l'informativa cambia, pubblicheremo qui l'aggiornamento con una nuova data."]]},
 terms:{t:"Termini d'uso", intro:"Usando il gioco accetti quanto segue.", s:[
  ["Il servizio","Peakle è offerto gratuitamente e “così com'è”. Le funzioni possono cambiare o essere sospese senza preavviso."],
  ["I tuoi impegni",["Non fingerti un'altra persona e non usare nickname offensivi o d'odio","Non sfruttare bug, non attaccare i server e non giocare con bot o script","Non manomettere account o dati di altri giocatori","Chi viola queste regole può vedersi cancellare nickname e dati"]],
  ["Foto e dati","Le foto sono immagini con licenza libera di Wikimedia Commons; autore e licenza appaiono dopo ogni risposta e nella pagina Crediti foto. Le altezze provengono da fonti pubbliche ma possono contenere errori."],
  ["Limitazione di responsabilità","Nei limiti consentiti dalla legge, il gestore non è responsabile per danni derivanti dall'uso del gioco."],
  ["Modifiche","Se questi termini cambiano, pubblicheremo qui l'aggiornamento con una nuova data."]]},
 contact:{t:"Contatti", intro:"Per segnalare bug, chiedere la cancellazione dei dati o proporre collaborazioni, scrivici qui.", btn:"Lascia un messaggio su GitHub", mail:"E-mail: "}},

ru:{nav:["Конфиденциальность","Условия","Контакты","Авторы фото","Вернуться в игру"], upd:"Действует с 19 октября 2026 г.",
 privacy:{t:"Политика конфиденциальности", intro:"Peakle («игра») — бесплатная веб-игра независимого разработчика. Здесь объясняется, какие данные использует игра и зачем.", s:[
  ["Какие данные мы собираем",["Выбранный тобой никнейм","Анонимный ID аккаунта, который автоматически создаётся для каждого устройства (Google Firebase Authentication)","Данные для входа, если ты задал пароль, — Google хранит пароль в зашифрованном виде, мы его никогда не видим","Игровая статистика (результаты дуэлей, очки за задания дня)","Временные данные комнат для дуэлей (удаляются после игры)","Настройки, которые хранятся только на твоём устройстве (язык, единицы, звук, прогресс задания)"]],
  ["Что мы не собираем","Мы не собираем имя, адрес эл. почты, номер телефона и местоположение."],
  ["Зачем мы их используем","Только чтобы никнеймы были уникальными, проводить дуэли 1 на 1, сохранять статистику и продолжать игру на другом устройстве, а также бороться с читерством."],
  ["Сторонние сервисы",["Google Firebase: серверы, вход и хранение данных (<a href='"+FIREBASE_PRIVACY+"'>конфиденциальность Firebase</a>)","Wikimedia Commons: при загрузке фото с серверов Wikimedia им могут передаваться данные о подключении (IP-адрес)","Реклама (после подключения): Google и другие партнёры могут использовать cookie для показа объявлений (<a href='"+GOOGLE_ADS_POLICY+"'>как Google использует данные</a>). Посетителей из ЕЭЗ, Великобритании и Швейцарии мы сначала спрашиваем о согласии. Персонализированную рекламу можно отключить в <a href='"+ADS_SETTINGS+"'>настройках рекламы Google</a>","Статистика (после подключения): только число посещений через Cloudflare Web Analytics без cookie"]],
  ["Хранение и удаление","Никнеймы и статистика хранятся, пока ты пользуешься игрой. Чтобы удалить их, пришли нам свой никнейм через контакты ниже. Настройки на устройстве удаляются при очистке данных браузера."],
  ["Дети","Игра не предназначена для детей младше 13 лет, и мы сознательно не собираем их персональные данные."],
  ["Изменения","Если политика изменится, мы опубликуем обновление здесь с новой датой."]]},
 terms:{t:"Условия использования", intro:"Пользуясь игрой, ты соглашаешься со следующим.", s:[
  ["Сервис","Peakle предоставляется бесплатно и «как есть». Функции могут меняться или отключаться без предупреждения."],
  ["Твои обязательства",["Не выдавать себя за других и не использовать оскорбительные или разжигающие ненависть никнеймы","Не использовать баги, не атаковать серверы и не играть с помощью ботов или скриптов","Не вмешиваться в аккаунты и статистику других игроков","За нарушение правил никнейм и статистика могут быть удалены"]],
  ["Фото и данные","Фото — свободно лицензированные изображения с Wikimedia Commons; автор и лицензия указываются после каждого ответа и на странице «Авторы фото». Высоты взяты из открытых источников, но могут содержать ошибки."],
  ["Ограничение ответственности","В пределах, допускаемых законом, оператор не несёт ответственности за ущерб, связанный с использованием игры."],
  ["Изменения","Если условия изменятся, мы опубликуем обновление здесь с новой датой."]]},
 contact:{t:"Контакты", intro:"Сообщения об ошибках, запросы на удаление данных и предложения о сотрудничестве — сюда.", btn:"Написать на GitHub", mail:"Эл. почта: "}},

tr:{nav:["Gizlilik","Koşullar","İletişim","Fotoğraf kaynakları","Oyuna dön"], upd:"Yürürlük tarihi: 19 Ekim 2026",
 privacy:{t:"Gizlilik Politikası", intro:"Peakle (“oyun”), bağımsız bir geliştirici tarafından işletilen ücretsiz bir web oyunudur. Bu politika, oyunun hangi bilgileri neden kullandığını açıklar.", s:[
  ["Topladığımız bilgiler",["Seçtiğin takma ad","Her cihaz için otomatik oluşturulan anonim hesap kimliği (Google Firebase Authentication)","Şifre belirlediysen giriş bilgileri — şifre Google tarafından şifrelenmiş olarak saklanır, biz asla göremeyiz","Oyun kayıtları (düello sonuçları, günlük puanlar)","Düello odalarının geçici verileri (oyun bitince silinir)","Yalnızca cihazında saklanan ayarlar (dil, birim, ses, günlük ilerleme)"]],
  ["Toplamadığımız bilgiler","Adını, e-posta adresini, telefon numaranı veya konumunu toplamayız."],
  ["Neden kullanıyoruz","Yalnızca takma adları benzersiz tutmak, 1'e 1 düelloları yürütmek, kayıtlarını saklayıp başka cihazda devam etmeni sağlamak ve hileyi önlemek için."],
  ["Üçüncü taraf hizmetler",["Google Firebase: sunucular, giriş ve veri depolama (<a href='"+FIREBASE_PRIVACY+"'>Firebase gizliliği</a>)","Wikimedia Commons: fotoğraflar Wikimedia sunucularından yüklenirken bağlantı bilgilerin (IP adresi) bu sunuculara iletilebilir","Reklam (etkinleştirildiğinde): Google ve diğer reklam ortakları reklam göstermek için çerez kullanabilir (<a href='"+GOOGLE_ADS_POLICY+"'>Google verileri nasıl kullanır</a>). AEA, Birleşik Krallık ve İsviçre'deki ziyaretçilerden önce izin isteriz. Kişiselleştirilmiş reklamları <a href='"+ADS_SETTINGS+"'>Google Reklam Ayarları</a>'ndan kapatabilirsin","İstatistik (etkinleştirildiğinde): çerezsiz Cloudflare Web Analytics ile yalnızca ziyaret sayısı"]],
  ["Saklama ve silme","Takma ad ve kayıtlar oyunu kullandığın sürece saklanır. Silinmesini istersen aşağıdaki iletişim yoluyla takma adını bize gönder. Cihazdaki ayarlar tarayıcı verilerini temizlediğinde silinir."],
  ["Çocuklar","Oyun 13 yaşından küçük çocuklara yönelik değildir ve onların kişisel verilerini bilerek toplamayız."],
  ["Değişiklikler","Politika değişirse güncellemeyi yeni tarihle burada yayımlarız."]]},
 terms:{t:"Kullanım Koşulları", intro:"Oyunu kullanarak aşağıdakileri kabul etmiş olursun.", s:[
  ["Hizmet","Peakle ücretsiz ve “olduğu gibi” sunulur. Özellikler haber verilmeksizin değişebilir veya durdurulabilir."],
  ["Taahhütlerin",["Başkasının kimliğine bürünme, hakaret veya nefret içeren takma ad kullanma","Hataları istismar etme, sunuculara saldırma, bot veya betikle oynama","Diğer oyuncuların hesaplarına veya kayıtlarına müdahale etme","Bu kurallara uymazsan takma adın ve kayıtların silinebilir"]],
  ["Fotoğraflar ve veriler","Fotoğraflar Wikimedia Commons'tan alınan özgür lisanslı görsellerdir; yazar ve lisans her cevaptan sonra ve Fotoğraf kaynakları sayfasında gösterilir. Yükseklikler kamuya açık kaynaklara dayanır ancak hata içerebilir."],
  ["Sorumluluğun sınırlandırılması","Yasaların izin verdiği ölçüde işletici, oyunun kullanımından doğan zararlardan sorumlu değildir."],
  ["Değişiklikler","Koşullar değişirse güncellemeyi yeni tarihle burada yayımlarız."]]},
 contact:{t:"İletişim", intro:"Hata bildirimi, veri silme talebi veya iş birliği için bize buradan ulaş.", btn:"GitHub'da mesaj bırak", mail:"E-posta: "}},

pl:{nav:["Prywatność","Regulamin","Kontakt","Autorzy zdjęć","Wróć do gry"], upd:"Obowiązuje od: 19 października 2026",
 privacy:{t:"Polityka prywatności", intro:"Peakle („gra”) to darmowa gra przeglądarkowa prowadzona przez niezależnego twórcę. Ta polityka wyjaśnia, jakich danych używa gra i dlaczego.", s:[
  ["Jakie dane zbieramy",["Wybrany przez ciebie pseudonim","Anonimowy identyfikator konta tworzony automatycznie dla każdego urządzenia (Google Firebase Authentication)","Dane logowania, jeśli ustawisz hasło — Google przechowuje je zaszyfrowane, my nigdy go nie widzimy","Statystyki gry (wyniki pojedynków, dzienne wyniki)","Tymczasowe dane pokoi pojedynków (usuwane po grze)","Ustawienia zapisane tylko na twoim urządzeniu (język, jednostka, dźwięk, postęp wyzwania)"]],
  ["Czego nie zbieramy","Nie zbieramy imienia, adresu e-mail, numeru telefonu ani lokalizacji."],
  ["Po co ich używamy","Wyłącznie po to, by pseudonimy były unikalne, by prowadzić pojedynki 1 na 1, zapisywać statystyki i umożliwić grę na innym urządzeniu oraz by zapobiegać oszustwom."],
  ["Usługi zewnętrzne",["Google Firebase: serwery, logowanie i przechowywanie danych (<a href='"+FIREBASE_PRIVACY+"'>prywatność Firebase</a>)","Wikimedia Commons: przy wczytywaniu zdjęć z serwerów Wikimedia mogą one otrzymać dane o połączeniu (adres IP)","Reklamy (po włączeniu): Google i inni partnerzy mogą używać plików cookie do wyświetlania reklam (<a href='"+GOOGLE_ADS_POLICY+"'>jak Google wykorzystuje dane</a>). Osoby z EOG, Wielkiej Brytanii i Szwajcarii najpierw prosimy o zgodę. Reklamy spersonalizowane możesz wyłączyć w <a href='"+ADS_SETTINGS+"'>ustawieniach reklam Google</a>","Statystyki (po włączeniu): tylko liczba odwiedzin, przez Cloudflare Web Analytics bez plików cookie"]],
  ["Przechowywanie i usuwanie","Pseudonimy i statystyki przechowujemy, dopóki korzystasz z gry. Aby je usunąć, wyślij nam swój pseudonim przez kontakt poniżej. Ustawienia na urządzeniu znikną po wyczyszczeniu danych przeglądarki."],
  ["Dzieci","Gra nie jest skierowana do dzieci poniżej 13 lat i świadomie nie zbieramy ich danych osobowych."],
  ["Zmiany","Jeśli polityka się zmieni, opublikujemy aktualizację tutaj z nową datą."]]},
 terms:{t:"Regulamin", intro:"Korzystając z gry, akceptujesz poniższe zasady.", s:[
  ["Usługa","Peakle jest udostępniane bezpłatnie i „w obecnym stanie”. Funkcje mogą się zmienić lub zostać wyłączone bez uprzedzenia."],
  ["Twoje zobowiązania",["Nie podszywaj się pod innych i nie używaj obraźliwych ani nienawistnych pseudonimów","Nie wykorzystuj błędów, nie atakuj serwerów i nie graj za pomocą botów lub skryptów","Nie ingeruj w konta ani statystyki innych graczy","Za złamanie zasad pseudonim i statystyki mogą zostać usunięte"]],
  ["Zdjęcia i dane","Zdjęcia to obrazy na wolnych licencjach z Wikimedia Commons; autor i licencja są podawane po każdej odpowiedzi i na stronie Autorzy zdjęć. Wysokości pochodzą z publicznych źródeł, ale mogą zawierać błędy."],
  ["Ograniczenie odpowiedzialności","W zakresie dozwolonym przez prawo operator nie odpowiada za szkody wynikające z korzystania z gry."],
  ["Zmiany","Jeśli regulamin się zmieni, opublikujemy aktualizację tutaj z nową datą."]]},
 contact:{t:"Kontakt", intro:"Zgłoszenia błędów, prośby o usunięcie danych i propozycje współpracy — tutaj.", btn:"Napisz na GitHubie", mail:"E-mail: "}},

zh:{nav:["隱私權政策","使用條款","聯絡我們","照片來源","回到遊戲"], upd:"生效日期:2026 年 10 月 19 日",
 privacy:{t:"隱私權政策", intro:"Peakle(以下稱「本遊戲」)是由獨立開發者經營的免費網頁遊戲。本政策說明本遊戲使用哪些資訊以及原因。", s:[

function pick(){
  const q=new URLSearchParams(location.search).get("lang");
  if(q&&T[q]) return q;
  try{ const s=localStorage.getItem("pk_lang"); if(s&&T[s]) return s; }catch(e){}
  for(const l of (navigator.languages||[navigator.language||"en"])){ const b=String(l).split("-")[0].toLowerCase(); if(T[b]) return b; }
  return "en";
}
let L=pick();
function block(id,d,extra){
  let h=`<section id="${id}"><h1>${d.t}</h1><p class="upd">${T[L].upd}</p><p>${d.intro}</p>`;
  for(const [hd,body] of (d.s||[])){
    h+=`<h2>${hd}</h2>`+(Array.isArray(body)?"<ul>"+body.map(x=>`<li>${x}</li>`).join("")+"</ul>":`<p>${body}</p>`);
  }
  return h+(extra||"")+"</section>";
}
function render(){
  const t=T[L];
  document.documentElement.lang = L==="pt"?"pt-BR":L==="zh"?"zh-Hant":L;
  document.getElementById("lang").value=L;
  document.getElementById("nav").innerHTML=[["#privacy",t.nav[0]],["#terms",t.nav[1]],["#contact",t.nav[2]],["credits.html?lang="+L,t.nav[3]],["./",t.nav[4]]]
    .map(([h,x])=>`<a href="${h}">${x}</a>`).join("");
  const c=t.contact;
  const contactExtra=`<p><a class="btn" href="${ISSUES}" target="_blank" rel="noopener">${c.btn}</a></p>`+(CONTACT_EMAIL?`<p>${c.mail}<a href="mailto:${CONTACT_EMAIL}">${CONTACT_EMAIL}</a></p>`:"");
  document.getElementById("main").innerHTML=block("privacy",t.privacy)+block("terms",t.terms)+`<section id="contact"><h1>${c.t}</h1><p>${c.intro}</p>${contactExtra}</section>`;
  document.title="Peakle — "+t.nav.slice(0,3).join(" · ");
  if(location.hash){ const el=document.querySelector(location.hash); if(el) el.scrollIntoView(); }
}
document.getElementById("lang").onchange=e=>{ L=e.target.value; try{localStorage.setItem("pk_lang",L);}catch(_){ } render(); };
render();
</script>
