<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Peakle — 세계 건축물 높이 맞추기 배틀</title>
<meta name="description" content="마천루·다리·성당·경기장… 세계 건축물의 높이를 맞춰라. 1대1 실시간 배틀, Peakle.">
<meta property="og:title" content="Peakle 🏙 세계 건축물 높이 맞추기 배틀">
<meta property="og:description" content="마천루·다리·성당·경기장의 높이를 맞춰라. 매일 새로운 데일리 챌린지와 1대1 실시간 배틀!">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0B1026">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://upload.wikimedia.org" crossorigin>
<link rel="preconnect" href="https://www.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --sky0:#0B1026; --sky1:#17244A; --ink:#0B1026;
  --snow:#F2F6F9; --ice:#BFE3EE; --dim:#8FA3BF;
  --glow:#FF8E6E; --glow2:#FFB27A;
  --ok:#7BE0AD; --bad:#FF5470;
  --card:rgba(255,255,255,.055); --line:rgba(191,227,238,.16);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:'Outfit',-apple-system,'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif;
  background:linear-gradient(180deg,var(--sky0) 0%,var(--sky1) 62%,#2A3B66 100%);
  color:var(--snow); min-height:100dvh; overflow-x:hidden;
}
#stars{position:fixed;inset:0;pointer-events:none;z-index:0}
#peaks{position:fixed;left:0;right:0;bottom:0;pointer-events:none;z-index:0;opacity:.9}
#app{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:20px 18px 150px;min-height:100dvh}
section{display:none;animation:fade .28s ease}
section.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.logo{font-weight:900;font-size:44px;letter-spacing:.04em;text-align:center;margin:26px 0 2px;color:var(--snow)}
.logo .pk{color:var(--glow)}
.tag{color:var(--dim);text-align:center;font-size:14px;margin-bottom:26px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.back{background:rgba(191,227,238,.16);border:1.5px solid rgba(191,227,238,.55);color:#fff;border-radius:12px;padding:9px 16px;font-size:17px;font-weight:900;cursor:pointer;font-family:inherit;box-shadow:0 2px 8px rgba(0,0,0,.35)}
.back:active{transform:scale(.95)}
.h1{font-size:20px;font-weight:700}

.field{margin:14px 0}
.lbl{display:block;font-size:13px;color:var(--dim);margin-bottom:6px}
input[type=text],input[type=tel],input[type=password]{
  width:100%;background:var(--card);border:1px solid var(--line);border-radius:14px;
  color:var(--snow);font-size:18px;padding:14px 16px;outline:none;font-family:inherit;font-weight:700;
}
input:focus{border-color:var(--glow)}
.btn{
  display:block;width:100%;border:none;border-radius:16px;padding:16px;margin:10px 0;
  font-size:17px;font-weight:700;cursor:pointer;font-family:inherit;color:var(--ink);
  background:linear-gradient(135deg,var(--glow2),var(--glow));transition:transform .08s;
}
.btn:active{transform:scale(.98)}
.btn.ghost{background:var(--card);color:var(--snow);border:1px solid var(--line)}
.btn.small{width:auto;display:inline-block;padding:10px 18px;font-size:14px;margin:4px 4px 4px 0}
.btn:disabled{opacity:.4;cursor:default}
.row{display:flex;gap:10px}.row .btn{flex:1}
.note{font-size:12.5px;color:var(--dim);line-height:1.55;margin-top:8px}
.chal{background:rgba(255,142,110,.12);border:1px solid rgba(255,142,110,.45);border-radius:16px;padding:12px 14px;margin:10px 0;text-align:center;font-size:14px;line-height:1.5}
.chal .btn{margin:8px 0 0}
.adslot{margin:14px 0;text-align:center;min-height:0}
.adslot:empty{display:none}
.footlinks{text-align:center;margin-top:18px;font-size:12px;color:var(--dim);line-height:2}
.footlinks a{color:var(--dim);text-decoration:none;margin:0 6px}
.footlinks a:hover{text-decoration:underline}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0}

/* 대전 화면 */
.hpwrap{display:flex;gap:10px;margin-bottom:6px}
.hpside{flex:1}
.hpname{font-size:12px;color:var(--dim);margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hpname.me{color:var(--ice)}
.hprow{display:flex;align-items:center;gap:6px;margin-bottom:4px;min-width:0}
.hprow.r{justify-content:flex-end}
.hprow .hpname{margin-bottom:0;min-width:0}
.mchip{flex:none;font-size:11px;font-weight:900;padding:2px 7px;border-radius:7px;background:rgba(255,255,255,.12);color:var(--ice);transition:transform .25s}
.mchip.hot{background:var(--glow2);color:var(--ink)}
.mchip.fire{background:var(--bad);color:#fff}
.mchip.bump{transform:scale(1.35)}
.hpbar{height:14px;border-radius:8px;background:rgba(0,0,0,.35);overflow:hidden;border:1px solid var(--line)}
.hpfill{height:100%;border-radius:8px;background:linear-gradient(90deg,var(--ok),#4CC98F);transition:width .6s cubic-bezier(.2,.8,.2,1)}
.hpfill.enemy{background:linear-gradient(90deg,var(--bad),#D63A5E)}
.hpnum{font-size:11px;color:var(--dim);margin-top:3px;text-align:right}
.roundbar{display:flex;justify-content:space-between;align-items:center;margin:10px 0 4px}
.roundtxt{font-size:14px;color:var(--ice);font-weight:700}
.mult{font-size:12px;font-weight:900;color:var(--ink);background:var(--glow2);border-radius:8px;padding:3px 8px}
.mult.x2{background:#FFD166}.mult.x3{background:var(--bad);color:#fff}

.mt{
  margin:10px 0;background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden;
}
.mtimg{width:100%;aspect-ratio:16/9;max-height:54vh;display:block;background:#101832;position:relative;overflow:hidden;transition:aspect-ratio .3s ease}
.mtimg svg{width:100%;height:100%;display:block}
.mtimg img.photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;z-index:1}
.mtimg img.photo.fit{object-fit:contain}
.mtimg img.photobg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:blur(20px) brightness(.5);transform:scale(1.15);z-index:0}
.phload{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--dim);font-size:13px}
.spin2{width:34px;height:34px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--glow);animation:sp 1s linear infinite}
.nickstat{font-size:12.5px;margin-top:6px;min-height:17px;color:var(--dim)}
.nickstat.ok{color:var(--ok)}.nickstat.bad{color:var(--bad)}
.nickstat button{background:none;border:none;color:var(--glow2);text-decoration:underline;font:inherit;cursor:pointer;padding:0 0 0 6px}
.mystats{font-size:13px;color:var(--ice);min-height:18px;margin:2px 0 6px}
.srclink{display:none;font-size:12px;color:var(--dim);margin-top:6px;text-decoration:underline}
.codeval{font-weight:900;letter-spacing:3px;color:var(--glow2)}
.mtcredit{position:absolute;right:6px;bottom:5px;font-size:10px;color:rgba(255,255,255,.85);background:rgba(0,0,0,.45);padding:2px 7px;border-radius:8px;text-decoration:none;z-index:2;pointer-events:none;user-select:none}
.mtmeta{display:flex;align-items:center;justify-content:center;gap:12px;padding:14px 14px 16px;text-align:left}
.mtflagimg{width:42px;height:auto;border-radius:5px;box-shadow:0 1px 5px rgba(0,0,0,.5);flex:none;border:1px solid rgba(255,255,255,.15)}
.mtname{font-size:26px;font-weight:900;word-break:keep-all;user-select:none;line-height:1.15}
.mtsub{font-size:13px;color:var(--dim);margin-top:3px}
.timer{height:8px;border-radius:6px;background:rgba(0,0,0,.35);overflow:hidden;margin:12px 0;border:1px solid var(--line)}
.timerfill{height:100%;background:linear-gradient(90deg,var(--ice),var(--glow));width:100%}
.guessrow{display:flex;gap:8px}
.guessrow input{flex:1;text-align:center;font-size:24px;font-weight:900;letter-spacing:.02em}
.unit{display:flex;align-items:center;color:var(--dim);font-weight:700;font-size:16px;padding:0 4px}
.gbtn{border:none;border-radius:14px;padding:0 22px;font-size:17px;font-weight:900;font-family:inherit;color:var(--ink);background:linear-gradient(135deg,var(--glow2),var(--glow));cursor:pointer}
.gbtn:disabled{opacity:.4}
.waitmsg{text-align:center;color:var(--dim);font-size:14px;margin-top:10px;min-height:20px}

/* 정답 공개 */
.reveal{text-align:center;padding:8px 0 4px}
.alt{font-size:52px;font-weight:900;color:var(--glow2);letter-spacing:.01em;font-variant-numeric:tabular-nums}
.altlbl{font-size:13px;color:var(--dim)}
.cmp{display:flex;gap:10px;margin-top:12px}
.cmpbox{flex:1;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px}
.cmpwho{font-size:12px;color:var(--dim)}
.cmpval{font-size:19px;font-weight:900;margin-top:2px;font-variant-numeric:tabular-nums}
.cmpdmg{font-size:14px;font-weight:900;margin-top:2px;color:var(--bad)}
.cmpdmg.pts{color:var(--ok)}
.cmppts{font-size:15px;font-weight:900;color:var(--ok);margin-top:3px}
.rematchmsg{text-align:center;color:var(--glow2);font-size:14px;font-weight:700;min-height:20px;margin-top:6px}

/* 결과 */
.bigres{text-align:center;margin:30px 0 8px;font-size:40px;font-weight:900}
.bigres.win{color:var(--ok)}.bigres.lose{color:var(--bad)}.bigres.draw{color:var(--ice)}
.score{text-align:center;font-size:48px;font-weight:900;color:var(--glow2);font-variant-numeric:tabular-nums}
.emrow{text-align:center;font-size:30px;letter-spacing:4px;margin:8px 0}
.codebox{text-align:center;font-size:40px;font-weight:900;letter-spacing:10px;color:var(--glow2);background:var(--card);border:1px dashed var(--line);border-radius:16px;padding:18px;margin:14px 0}
.spin{width:44px;height:44px;border-radius:50%;border:4px solid var(--line);border-top-color:var(--glow);animation:sp 1s linear infinite;margin:26px auto}
@keyframes sp{to{transform:rotate(360deg)}}
.center{text-align:center}
.setrow{display:flex;justify-content:space-between;align-items:center;padding:14px 2px;border-bottom:1px solid var(--line)}
.setrow:last-child{border-bottom:none}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:none;background:none;color:var(--dim);padding:8px 14px;font-family:inherit;font-weight:700;font-size:14px;cursor:pointer}
.seg button.on{background:var(--glow);color:var(--ink)}
select{background:var(--card);border:1px solid var(--line);color:var(--snow);border-radius:10px;padding:8px 10px;font-family:inherit;font-size:14px}
select option{color:#000}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:rgba(11,16,38,.95);border:1px solid var(--line);color:var(--snow);padding:12px 20px;border-radius:14px;font-size:14px;z-index:99;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1}
.pill{display:inline-block;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:4px 12px;font-size:12px;color:var(--dim);margin:2px}
</style>
</head>
<body>
<canvas id="stars"></canvas>
<svg id="peaks" viewBox="0 0 480 150" preserveAspectRatio="xMidYMax slice" height="150" width="100%">
  <polygon points="0,150 60,70 110,120 170,40 230,120 280,80 340,130 400,55 480,150" fill="#131C3B"/>
  <polygon points="0,150 90,95 150,135 220,75 300,140 370,95 440,140 480,120 480,150" fill="#0E1530"/>
  <polygon points="165,46 170,40 176,47 172,45 169,48" fill="#E8F2F7"/>
  <polygon points="395,61 400,55 406,62 401,60" fill="#E8F2F7"/>
</svg>
<div id="app">

<!-- 홈 -->
<section id="s-home" class="on">
  <div class="logo">PE<span class="pk">A</span>KLE</div>
  <div class="tag" data-i="tag"></div>
  <div class="field">
    <label class="lbl" data-i="nick"></label>
    <input type="text" id="nick" maxlength="12" autocomplete="off">
    <div class="nickstat" id="nickstat"></div>
    <div id="recoverrow" style="display:none">
      <div id="loginrow">
        <div class="guessrow" style="margin-top:8px">
          <input type="password" id="lpw" maxlength="64" autocomplete="current-password" style="font-size:16px">
          <button class="gbtn" id="b-login" style="font-size:14px;padding:0 14px"></button>
        </div>
        <div class="nickstat"><button id="b-forgot" style="padding:0"></button></div>
      </div>
      <div id="coderow" style="display:none">
        <div class="nickstat" id="nopwnote" style="display:none"></div>
        <div class="guessrow" style="margin-top:8px">
          <input type="text" id="recode" maxlength="9" autocomplete="off" style="text-transform:uppercase;letter-spacing:3px;text-align:center;font-size:16px">
          <button class="gbtn" id="b-recover" style="font-size:14px;padding:0 14px"></button>
        </div>
      </div>
    </div>
  </div>
  <div class="center mystats" id="mystats"></div>
  <div class="chal" id="chalbox" style="display:none"><div id="chaltxt"></div><button class="btn small" id="b-chal"></button></div>
  <button class="btn" id="b-daily"></button>
  <button class="btn" id="b-battle"></button>
  <button class="btn ghost" id="b-practice"></button>
  <button class="btn ghost" id="b-settings"></button>
  <div class="center" style="margin-top:14px">
    <span class="pill" id="mtcount"></span>
  </div>
  <div class="adslot" id="ad-home"></div>
  <div class="footlinks" id="footlinks"></div>
</section>

<!-- 대결 로비 -->
<section id="s-battle">
  <div class="top"><button class="back" data-go="home">←</button><div class="h1" data-i="battle"></div></div>
  <button class="btn" id="b-quick"></button>
  <button class="btn ghost" id="b-create"></button>
  <div class="field">
    <label class="lbl" data-i="join_lbl"></label>
    <div class="guessrow">
      <input type="text" id="joincode" maxlength="5" autocomplete="off" style="text-transform:uppercase;letter-spacing:6px;text-align:center">
      <button class="gbtn" id="b-join" data-i="join"></button>
    </div>
  </div>
  <p class="note" data-i="battle_note"></p>
</section>

<!-- 매칭/대기 -->
<section id="s-wait">
  <div class="top"><button class="back" id="b-cancelwait">←</button><div class="h1" id="waittitle"></div></div>
  <div class="spin"></div>
  <div class="center" id="waitdesc" style="color:var(--dim);font-size:14px"></div>
  <div class="codebox" id="roomcodebox" style="display:none"></div>
  <button class="btn ghost" id="b-copycode" style="display:none"></button>
  <button class="btn ghost" id="b-invite" style="display:none"></button>
</section>

<!-- 게임(공용: 대결/데일리/연습) -->
<section id="s-game">
  <div id="hparea">
    <div class="hpwrap">
      <div class="hpside"><div class="hprow"><div class="hpname me" id="myname"></div><span class="mchip" id="mymult">×1</span></div><div class="hpbar"><div class="hpfill" id="myhp"></div></div><div class="hpnum" id="myhpn"></div></div>
      <div class="hpside"><div class="hprow r"><span class="mchip" id="foemult">×1</span><div class="hpname" id="foename" style="text-align:right"></div></div><div class="hpbar"><div class="hpfill enemy" id="foehp"></div></div><div class="hpnum" id="foehpn" style="text-align:left"></div></div>
    </div>
  </div>
  <div class="roundbar">
    <div class="roundtxt" id="roundtxt"></div>
    <div class="mult" id="multbadge" style="display:none"></div>
    <div class="roundtxt" id="scoretxt" style="color:var(--glow2)"></div>
  </div>
  <div class="mt">
    <div class="mtimg" id="mtimg"></div>
    <div class="mtmeta">
      <img class="mtflagimg" id="mtflag" alt="flag">
      <div>
        <div class="mtname" id="mtname">—</div>
        <div class="mtsub" id="mtsub"></div>
      </div>
    </div>
  </div>
  <div class="timer"><div class="timerfill" id="timerfill"></div></div>
  <div id="guessarea">
    <div class="guessrow">
      <input type="tel" id="guess" inputmode="numeric" autocomplete="off" placeholder="0">
      <div class="unit" id="unitlbl">m</div>
      <button class="gbtn" id="b-submit">⏎</button>
    </div>
    <div class="waitmsg" id="waitmsg"></div>
  </div>
  <div id="revealarea" style="display:none">
    <div class="reveal">
      <div class="altlbl" data-i="answer"></div>
      <div class="alt" id="altnum">0</div>
      <div class="cmp" id="cmparea"></div>
    </div>
    <div class="waitmsg" id="nextmsg"></div>
    <div class="center"><a class="srclink" id="srclink" target="_blank" rel="noopener"></a></div>
  </div>
  <button class="btn ghost" id="b-quitgame" style="margin-top:16px"></button>
</section>

<!-- 대결 결과 -->
<section id="s-result">
  <div class="bigres" id="restitle"></div>
  <div class="center" id="ressub" style="color:var(--dim)"></div>
  <div class="card">
    <div class="cmp">
      <div class="cmpbox"><div class="cmpwho" id="r-myname"></div><div class="cmpval" id="r-myhp"></div></div>
      <div class="cmpbox"><div class="cmpwho" id="r-foename"></div><div class="cmpval" id="r-foehp"></div></div>
    </div>
  </div>
  <button class="btn" id="b-rematch"></button>
  <div class="rematchmsg" id="rematchmsg"></div>
  <button class="btn ghost" id="b-share-battle"></button>
  <div class="adslot" id="ad-result"></div>
  <button class="btn ghost" data-go="home" data-i="home"></button>
</section>

<!-- 데일리 결과 -->
<section id="s-daily-result">
  <div class="top"><button class="back" data-go="home">←</button><div class="h1" id="dailytitle"></div></div>
  <div class="score" id="dailyscore"></div>
  <div class="center" style="color:var(--dim);font-size:13px" data-i="daily_max"></div>
  <div class="emrow" id="dailyemoji"></div>
  <div class="card" id="dailydetail" style="font-size:14px;line-height:2"></div>
  <div class="card" id="dailyrank" style="display:none;font-size:14px;line-height:1.9"></div>
  <button class="btn" id="b-share-daily"></button>
  <div class="adslot" id="ad-daily"></div>
  <button class="btn ghost" data-go="home" data-i="home"></button>
  <p class="note center" data-i="daily_next"></p>
</section>

<!-- 설정 -->
<section id="s-settings">
  <div class="top"><button class="back" data-go="home">←</button><div class="h1" data-i="settings"></div></div>
  <div class="card">
    <div class="setrow"><span data-i="lang"></span>
      <select id="langsel">
        <option value="ko">한국어</option>
        <option value="en">English</option>
        <option value="es">Español</option>
        <option value="pt">Português (Brasil)</option>
        <option value="ja">日本語</option>
        <option value="de">Deutsch</option>
        <option value="fr">Français</option>
        <option value="it">Italiano</option>
        <option value="ru">Русский</option>
        <option value="tr">Türkçe</option>
        <option value="pl">Polski</option>
        <option value="zh">繁體中文</option>
      </select>
    </div>
    <div class="setrow"><span data-i="unit"></span>
      <div class="seg"><button id="u-m">m</button><button id="u-ft">ft</button></div>
    </div>
    <div class="setrow"><span data-i="sound"></span>
      <div class="seg"><button id="snd-on" data-i="on"></button><button id="snd-off" data-i="off"></button></div>
    </div>
  </div>
  <div class="card" id="pwcard">
    <div class="setrow"><span><span data-i="pw_title"></span> <b id="pwnick" style="color:var(--ice)"></b></span><b id="pwstate"></b></div>
    <input type="password" id="pwold" maxlength="64" autocomplete="current-password" style="margin-top:10px;display:none">
    <input type="password" id="pwnew" maxlength="64" autocomplete="new-password" style="margin-top:10px">
    <button class="btn small" id="b-setpw"></button>
    <button class="btn ghost small" id="b-logout" style="display:none" data-i="logout"></button>
    <p class="note" data-i="pw_note"></p>

  "getAuth","signInAnonymously","onAuthStateChanged","signInWithEmailAndPassword","EmailAuthProvider",

let netAwake = false, netIdleT = null, dbConnected = false;
const NET_IDLE = 30000;
function wake(){
  if(!netAwake){ netAwake = true; goOnline(db); }

}
function netNap(){

function detectLang(){
  const saved=localStorage.getItem("pk_lang");
  if(saved && LANGS.includes(saved)) return saved;
  const prefs=(navigator.languages&&navigator.languages.length?navigator.languages:[navigator.language||"en"]);
  for(const p of prefs){ const b=String(p).toLowerCase().split("-")[0]; if(LANGS.includes(b)) return b; }
  return "en";
}

const BAD = ["시발","씨발","씨빨","병신","병1신","개새","존나","좆","자지","보지","니미","걸레","창녀","fuck","shit","bitch","asshole","nigger","nigga","cunt","faggot","porn","sex","dick","pussy","whore","rape"];

const esc = s => String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function nickname(){ return ($("nick").value||"").trim().replace(/\s+/g," "); }
const NICK_RE=/^[\p{L}\p{N}_\- ]{2,12}$/u;
function nickProblem(n){
  if(n.length<2) return "nick_short";
  if(!NICK_RE.test(n)) return "nick_chars";
  const low=n.toLowerCase().replace(/[\s_\-.0-9]/g,"");
  if(BAD.some(b=>low.includes(b))) return "nick_bad";
  return null;
}
const nickKey = n => encodeURIComponent(n.trim().toLowerCase()).replace(/\./g,"%2E");
let myNickKey = localStorage.getItem("pk_nickkey") || null;
let verifiedKey = null;   // 이번 접속에서 서버로 소유 확인을 마친 닉네임
let myStats = null;
function genCode(){ const A="ABCDEFGHJKLMNPQRSTUVWXYZ23456789", b=new Uint8Array(8); crypto.getRandomValues(b); return [...b].map(x=>A[x%32]).join(""); }
const fmtCode = c => c ? c.slice(0,4)+"-"+c.slice(4) : "—";
function setMine(n,k){ myNickKey=k; verifiedKey=k; localStorage.setItem("pk_nickkey",k); localStorage.setItem("pk_nick",n); localStorage.setItem("pk_nickname_of_"+k,n); }
/* 닉네임 차지: ok | taken | offline */
async function claimNick(n){
  if(!await online()) return "offline";
  const k=nickKey(n);
  try{
    const o=await get(ref(db,`nicknames/${k}/owner`));
    if(o.exists() && o.val()!==AUID) return "taken";
    if(!o.exists()){
      const code=genCode();
      await set(ref(db,`nicknames/${k}`),{owner:AUID,code,nick:n});   // 동시에 누가 먼저 가져가면 보안 규칙이 거부
      localStorage.setItem("pk_code_"+k,code);
      if(isPwUser()) markPw(k);
    } else if(isPwUser() && verifiedKey!==k) markPw(k);
    setMine(n,k); loadStats(); return "ok";
  }catch(e){ return "taken"; }
}
/* 모드 시작 전 닉네임 확인. needNet=true면 온라인 필수(대결) */
async function ensureNick(needNet){
  const n=nickname(), p=nickProblem(n);
  if(p){ toast(t(p)); return false; }
  if(!AUID && !needNet){ localStorage.setItem("pk_nick",n); return true; }   // 아직 서버 연결 전: 혼자 하는 모드는 바로 시작
  const r=await claimNick(n);   // 매번 서버에서 소유 여부 확인 (다른 기기가 복구해 간 경우 대비)
  if(r==="ok") return true;
  if(r==="taken"){ toast(t("nick_taken")); nickStatus(); return false; }
  if(needNet){ toast(t("offline")); return false; }
  localStorage.setItem("pk_nick",n); return true;   // 혼자 하는 모드는 오프라인이어도 가능
}
let nickTimer=null;
function nickStatus(){
  clearTimeout(nickTimer);
  const el=$("nickstat"), n=nickname(); $("recoverrow").style.display="none"; $("lpw").value="";
  el.className="nickstat"; el.textContent="";
  if(!n) return;
  const p=nickProblem(n); if(p){ el.className="nickstat bad"; el.textContent=t(p); return; }
  nickTimer=setTimeout(async()=>{
    if(!await online()) return;
    const k=nickKey(n);
    try{
      const o=await get(ref(db,`nicknames/${k}/owner`)); if(nickname()!==n) return;
      if(!o.exists()){ el.className="nickstat ok"; el.textContent="✓ "+t("nick_free"); }
      else if(o.val()===AUID){ el.className="nickstat ok"; el.textContent="✓ "+t("nick_mine"); if(myNickKey!==k){ setMine(n,k); loadStats(); } }
      else { el.className="nickstat bad"; el.innerHTML="✗ "+esc(t("nick_taken"))+'<button id="b-showrec">'+esc(t("recover_q"))+"</button>";
             let hasPw=null; try{ hasPw=(await get(ref(db,`nicknames/${k}/pw`))).val()===true; }catch(e){}   // null = 확인 불가(규칙 미갱신)
             $("b-showrec").onclick=()=>openLogin(hasPw); }
    }catch(e){}
  },350);
}
async function recoverNick(){
  const n=nickname(), code=($("recode").value||"").toUpperCase().replace(/[^A-Z0-9]/g,"");
  if(nickProblem(n)||code.length!==8){ toast(t("recover_bad")); return; }
  if(!await online()){ toast(t("offline")); return; }
  const k=nickKey(n);
  try{
    await set(ref(db,`nicknames/${k}`),{owner:AUID,code,nick:n});   // 코드가 맞을 때만 보안 규칙이 허용
    localStorage.setItem("pk_code_"+k,code); setMine(n,k);
    $("recoverrow").style.display="none"; toast(t("recover_ok")); nickStatus(); loadStats();
  }catch(e){ toast(t("recover_bad")); }
}
/* 이미 쓰는 닉네임 → 로그인 창 (비밀번호가 없는 닉네임이면 복구 코드 창) */
function openLogin(hasPw){
  $("recoverrow").style.display="block";
  const usePw = hasPw!==false;
  $("loginrow").style.display = usePw ? "block" : "none";
  $("coderow").style.display = usePw ? "none" : "block";
  $("nopwnote").style.display = usePw ? "none" : "block";
  (usePw ? $("lpw") : $("recode")).focus();
}
async function loginNick(){
  const n=nickname(), pw=$("lpw").value;
  if(nickProblem(n) || !pw){ toast(t("login_bad")); return; }
  if(!await online()){ toast(t("offline")); return; }
  const k=nickKey(n), btn=$("b-login"); btn.disabled=true;
  try{
    const o=await get(ref(db,`nicknames/${k}/owner`));
    if(!o.exists() || o.val()===AUID){ nickStatus(); return; }
    const cred=await signInWithEmailAndPassword(auth, emailOf(o.val()), pw);
    AUID=cred.user.uid; uid=AUID+"_"+TAB;
    localStorage.removeItem("pk_code_"+k);   // 이 기기에 남아 있던 옛 코드는 버리고 서버 값을 사용
    setMine(n,k); $("lpw").value=""; $("recoverrow").style.display="none";
    toast(t("login_ok")); nickStatus(); loadStats(); renderPw();
  }catch(e){
    const c=(e&&e.code)||"";
    toast(c.includes("too-many") ? t("login_many") : c.includes("network") ? t("offline") : t("login_bad"));
  }finally{ btn.disabled=false; }
}
async function markPw(k){ try{ await update(ref(db,`nicknames/${k}`),{pw:true}); }catch(e){} }

  $("b-setpw").textContent = has ? t("pw_change_btn") : t("pw_set_btn");
  $("b-logout").style.display = has ? "inline-block" : "none";

async function setPassword(){
  const p1=$("pwnew").value, old=$("pwold").value;
  if(p1.length<6){ toast(t("pw_short")); return; }
  if(!await online()){ toast(t("offline")); return; }
  const btn=$("b-setpw"); btn.disabled=true;
  try{
    const u=auth.currentUser;
    if(isPwUser()){
      if(!old){ toast(t("login_bad")); return; }
      await reauthenticateWithCredential(u, EmailAuthProvider.credential(emailOf(u.uid), old));
      await updatePassword(u, p1);
      toast(t("pw_changed"));
    }else{
      const n=nickname()||localStorage.getItem("pk_nick")||"";
      if(!n || nickProblem(n)){ toast(t("pw_need_nick")); return; }
      const r=await claimNick(n);
      if(r!=="ok"){ toast(t(r==="offline" ? "offline" : "nick_taken")); return; }
      await linkWithCredential(u, EmailAuthProvider.credential(emailOf(u.uid), p1));
      await markPw(myNickKey);
      toast(t("pw_set_ok"));
    }
    $("pwnew").value=""; $("pwold").value="";
  }catch(e){
    const c=(e&&e.code)||"";
    toast(/wrong-password|invalid-credential/.test(c) ? t("login_bad") : c.includes("too-many") ? t("login_many")
        : c.includes("weak-password") ? t("pw_short") : c.includes("network") ? t("offline") : t("pw_err"));
  }finally{ btn.disabled=false; renderPw(); }
}

/* 데일리 연속 기록: 이 기기 기록 + 서버 기록(다른 기기에서 한 것 포함). 오늘 아직 안 했으면 어제까지로 계산 */
function dailyStreak(){
  const done=new Set();
  try{ for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i); if(k&&k.startsWith("pk_d2_")) done.add(+k.slice(6)); } }catch(e){}
  if(myStats&&myStats.daily) Object.keys(myStats.daily).forEach(k=>done.add(+k));
  let d=dailyNum(); if(!done.has(d)) d--;
  let n=0; while(done.has(d)){ n++; d--; }
  return n;
}
function renderStats(){
  const s=myStats||{}, el=$("mystats");
  const parts=[];
  const st=dailyStreak(); if(st>=2) parts.push("🔥 "+t("streak_n")(st));
  if(s.games) parts.push(`🏆 ${s.wins||0}${t("w")} ${s.losses||0}${t("l")}`+(s.draws?` ${s.draws}${t("d")}`:""));
  if(s.best) parts.push(`📅 ${t("daily_best")} ${s.best.toLocaleString()}`);
  el.textContent=parts.join("  ·  ");
}

/* 데미지/점수: 오차비율 r → 0~1000 (GeoGuessr식 곡선) */
/* ===== GeoGuessr식 점수 =====
   라운드 점수 0~5000. 오직 "실제 높이와 몇 m 차이 나는가"로만 계산.
   → 같은 문제에서는 더 가깝게 맞힌 사람이 항상 더 높은 점수 (높게/낮게 찍은 방향은 무관)
   오차 2% 이내 만점, 10%≈4,300점, 30%≈3,200점, 50%≈2,400점 */
const MAXPTS=5000, START_HP=1000, APP_VER=12;
function calcScore(guessM, actualM){
  if(guessM==null||guessM<=0) return 0;
  const r=Math.abs(guessM-actualM)/actualM;   // 실제 높이 대비 차이(m)의 비율
  if(r<=0.02) return MAXPTS;
  return Math.round(MAXPTS*Math.exp(-1.5*r));
}
/* ===== 개인 배수 (GeoGuessr 2026년 4월~ 랭크 듀얼 방식) =====
   - 두 사람 모두 ×1로 시작
   - 라운드에서 상대보다 가깝게 맞히면 → 내 배수 +0.5 (다음 라운드부터 적용)
   - 진 라운드: 배수 유지 (LOSE_RESET=true로 바꾸면 ×1로 초기화)
   - 비긴 라운드: 둘 다 그대로 */
const MULT_STEP=0.5, LOSE_RESET=false;
const nextMult=(m,won,lost)=> won ? m+MULT_STEP : (lost&&LOSE_RESET ? 1 : m);
/* ===== 대결 데미지 =====
   각자의 오차(m) = |추측 - 실제|. 시간 초과는 0m를 적은 것으로 처리(오차 = 실제 높이).
   오차가 작은 쪽이 이기고, 두 사람 오차의 차이(m) × 이긴 쪽 배수 만큼 진 쪽 체력이 깎임. (단위가 ft여도 계산은 m) */
const errOf = (g,act) => (g==null||g<0) ? act : Math.abs(g-act);
function resolveRound(eA,eB,mA,mB){
  const diff=Math.abs(eA-eB);
  if(eA<eB) return {a:0,b:Math.round(diff*mA),mA:nextMult(mA,true,false),mB:nextMult(mB,false,true),usedA:mA,usedB:mB};
  if(eB<eA) return {a:Math.round(diff*mB),b:0,mA:nextMult(mA,false,true),mB:nextMult(mB,true,false),usedA:mA,usedB:mB};
  return {a:0,b:0,mA,mB,usedA:mA,usedB:mB};
}

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function pickSeeded(seed,count){
  const rnd = mulberry32(seed), out=new Set();
  while(out.size<count) out.add(Math.floor(rnd()*MT.length));
  return [...out];
}

const CATIDX={};
MT.forEach((m,i)=>{const c=m[4]||0;(CATIDX[c]=CATIDX[c]||[]).push(i);});
const CATKEYS=Object.keys(CATIDX);
function pickBalanced(rnd,count){
  const out=new Set();
  while(out.size<count){
    const arr=CATIDX[CATKEYS[Math.floor(rnd()*CATKEYS.length)]];
    out.add(arr[Math.floor(rnd()*arr.length)]);
  }
  return [...out];
}
const pickBalancedSeeded=(seed,count)=>pickBalanced(mulberry32(seed),count);

const IMG_HOSTS=["https://upload.wikimedia.org","https://thumb.wikimedia.org"];
function photoURLs(m){
  const out=[];
  const LOCAL=window.PHOTOS||{};
  for(const [p,r] of (m[5]||[])){
    const t=p.match(/^(.*)\/([^/]+)@(\d+)$/);
    if(LOCAL[p]) out.push({u:LOCAL[p][0],file:t?t[2]:p.split("/").pop(),r});   // Peakle 사이트에 올려 둔 사진 (가장 빠름)
    if(t) IMG_HOSTS.forEach(hst=>out.push({u:hst+"/wikipedia/commons/thumb/"+t[1]+"/"+t[2]+"/"+t[3]+"px-"+t[2],file:t[2],r}));
    else out.push({u:IMG_HOSTS[0]+"/wikipedia/commons/"+p,file:p.split("/").pop(),r});
  }
  return out;
}
function tryLoad(u,ms){
  return new Promise(res=>{
    const i=new Image();
    const tm=setTimeout(()=>{i.onload=i.onerror=null;res(null);},ms);
    i.onload=()=>{clearTimeout(tm);res(i.naturalWidth>40?{u,w:i.naturalWidth,h:i.naturalHeight}:null);};
    i.onerror=()=>{clearTimeout(tm);res(null);};
    i.src=u;
  });
}
const photoMemo=new Map();
function getPhoto(m){
  const key=m[0];
  if(photoMemo.has(key)) return photoMemo.get(key);
  const pr=(async()=>{
    const list=photoURLs(m);
    for(let lap=0;lap<2;lap++){
      for(const c of list){ const ok=await tryLoad(c.u,lap?15000:9000); if(ok) return {...ok,file:c.file}; }
      await new Promise(s=>setTimeout(s,1200));
    }
    return null;
  })();
  photoMemo.set(key,pr);
  pr.then(v=>{ if(!v) photoMemo.delete(key); });   // 실패 기록은 남기지 않음 → 다음에 다시 시도
  return pr;
}
const preloadPhotos=list=>list.forEach(m=>{ if(m) getPhoto(m); });

}

/* ================= 효과음 (WebAudio 합성) ================= */
let AC;
function beep(freqs,dur=.16,gain=.12){
  if(!sound) return;
  try{
    AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    freqs.forEach((f,i)=>{
      const o=AC.createOscillator(), g=AC.createGain();
      o.type="sine"; o.frequency.value=f;
      g.gain.setValueAtTime(0,AC.currentTime+i*dur);
      g.gain.linearRampToValueAtTime(gain,AC.currentTime+i*dur+.02);
      g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+(i+1)*dur);
      o.connect(g).connect(AC.destination);
      o.start(AC.currentTime+i*dur); o.stop(AC.currentTime+(i+1)*dur+.05);
    });
  }catch(e){}
}

let G = null;           // 현재 게임 상태
let timerRAF = null, revealTimer = null, unsub = [], matchTimer = null;

function cleanupGame(){
  cancelAnimationFrame(timerRAF); clearTimeout(revealTimer); clearTimeout(matchTimer);
  photoToken++; curPhotoFile=null; $("srclink").style.display="none";
  unsub.forEach(u=>u()); unsub=[];
  const g=G; G=null;
  if(g && g.fb){
    wake();   // 방 정리 기록이 끝날 때까지 연결 유지
    clearTimeout(g.joinTimer);
    if(g.slotMine){ // 대기 슬롯이 아직 내 것이면 비우기
      onDisconnect(SLOT()).cancel().catch(()=>{});
      runTransaction(SLOT(),cur=>(cur&&cur.uid===uid)?null:cur).catch(()=>{});
    }
    if(g.roomRef){
      onDisconnect(ref(db,`rooms/${g.roomId}/players/${uid}/left`)).cancel().catch(()=>{});
      if(g.iAmHost && g.phase==="lobby") remove(g.roomRef).catch(()=>{});
      else if(g.phase==="end" && (g.foeLeft||!g.foeUid)) remove(g.roomRef).catch(()=>{}); // 마지막으로 나가는 사람이 방 정리
      else update(ref(db,`rooms/${g.roomId}/players/${uid}`),{left:true})
        .then(()=>get(ref(db,`rooms/${g.roomId}/players`)))   // 동시에 나간 경우: 모두 나갔으면 방 정리
        .then(s=>{ const ps=Object.values(s.val()||{}); if(ps.length && ps.every(p=>p.left)) return remove(g.roomRef); })
        .catch(()=>{});
    }
  }
}

/* 혼자 하는 모드: 사진이 화면에 뜬 뒤에 15초 타이머 시작 (최대 8초 대기) */
function startTimerWhenShown(shown,onExpire){
  const g0=G, tok=photoToken;
  $("timerfill").style.width="100%";
  Promise.race([shown,new Promise(s=>setTimeout(s,8000))]).then(()=>{
    if(G!==g0||tok!==photoToken||!G||G.locked) return;
    G.deadline=now()+15000; runTimer(G.deadline,onExpire);
  });
}
function runTimer(deadline,onExpire){
  cancelAnimationFrame(timerRAF);
  const total=15000;
  const tick=()=>{
    const left=Math.max(0,deadline-now());
    $("timerfill").style.width=(left/total*100)+"%";
    $("timerfill").style.background=left<4000?"var(--bad)":"linear-gradient(90deg,var(--ice),var(--glow))";
    if(left<=0){ onExpire&&onExpire(); return; }
    timerRAF=requestAnimationFrame(tick);
  };
  tick();
}
function countUp(el,target){
  const t0=performance.now(),dur=900;
  const step=n=>{const p=Math.min(1,(n-t0)/dur),e=1-Math.pow(1-p,3);
    el.textContent=Math.round(target*e).toLocaleString()+" "+unit;
    if(p<1)requestAnimationFrame(step);};
  requestAnimationFrame(step);
}
function cmpBox(who,val,sub,isPts){
  return `<div class="cmpbox"><div class="cmpwho">${esc(who)}</div><div class="cmpval">${val}</div><div class="cmpdmg${isPts?" pts":""}">${sub}</div></div>`;
}

/* ================= 싱글 (데일리 / 연습) ================= */
const DAILY_KEY="pk_d2_";   // 점수 체계 변경(25,000점제)으로 키 교체
const DPROG="pk_dprog_";      // 데일리 진행상황 (나갔다가 이어하기)
async function startSolo(mode){
  if(!await ensureNick(false)) return;
  const dn=dailyNum();
  let prog=null;
  if(mode==="daily"){
    const saved=localStorage.getItem(DAILY_KEY+dn);
    if(saved){ showDailyResult(JSON.parse(saved),dn); return; }
    const srv=await serverDaily(dn);                 // 다른 기기에서 이미 했는지 (닉네임 기준)
    if(srv){ localStorage.setItem(DAILY_KEY+dn,JSON.stringify(srv)); showDailyResult(srv,dn); return; }
    try{ prog=JSON.parse(localStorage.getItem(DPROG+dn)||"null"); }catch(e){ prog=null; }
    // 사진을 본 뒤 창을 닫았던 라운드는 0점 처리 (닫고 검색한 뒤 다시 들어오는 것 방지)
    if(prog && prog.seen===prog.r){ prog.p.push(0); prog.r++; prog.seen=0; }
  }
  G={mode, fb:false, round:prog?prog.r:1, pts:prog?prog.p:[], guesses:[], used:new Set(), next:null,
     mts: mode==="daily" ? pickBalancedSeeded(dn*7919+13,5) : null,
     total: mode==="daily" ? 5 : Infinity };
  if(mode==="daily" && G.round>5){ finishDaily(); return; }
  if(G.mts) preloadPhotos(G.mts.slice(G.round-1).map(i=>MT[i]));
  $("hparea").style.display="none"; $("multbadge").style.display="none";
  $("b-quitgame").style.display="block";
  screen("game"); soloRound();
}
function saveDailyProg(seen){
  if(!G||G.mode!=="daily") return;
  localStorage.setItem(DPROG+dailyNum(),JSON.stringify({r:G.round,p:G.pts,seen:seen?G.round:0}));
}
function finishDaily(){
  const dn=dailyNum(), res={s:G.pts.reduce((a,b)=>a+b,0),p:G.pts.slice(0,5)};
  localStorage.setItem(DAILY_KEY+dn,JSON.stringify(res));
  localStorage.removeItem(DPROG+dn);
  recordDaily(dn,res);
  showDailyResult(res,dn);
}
function soloRound(){
  let idx;
  if(G.mode==="daily"){ idx=G.mts[G.round-1]; }
  else{ // 연습: 이번 판에 나온 문제는 다시 안 나옴 (전부 소진 시 초기화) + 다음 문제 사진 미리 받기
    if(G.used.size>=MT.length) G.used.clear();
    const pickUnused=()=>{ let k; do{ k=pickOneBalanced(); }while(G.used.has(k)); return k; };
    idx=(G.next!=null&&!G.used.has(G.next))?G.next:pickUnused();
    G.used.add(idx);
    G.next=G.used.size<MT.length?pickUnused():null;
    if(G.next!=null) preloadPhotos([MT[G.next]]);
  }
  G.cur=idx;
  const m=MT[idx];
  if(G.mode==="daily") saveDailyProg(true);
  $("roundtxt").textContent = t("round")+" "+G.round+(G.mode==="daily"?" / 5":"");
  const sum=G.pts.reduce((a,b)=>a+b,0);
  $("scoretxt").textContent = G.mode==="practice" && G.pts.length
    ? t("avg_pts")+" "+Math.round(sum/G.pts.length).toLocaleString() : (G.mode==="daily"? sum.toLocaleString()+t("pts") : "");
  startTimerWhenShown(showMountain(m),()=>soloSubmit(null));
}
function soloSubmit(raw){
  if(!G||G.locked)return; G.locked=true;
  cancelAnimationFrame(timerRAF);
  const m=MT[G.cur], actual=m[2];
  const guessM = raw==null?null:fromUnit(raw);
  const pts=calcScore(guessM,actual);
  G.pts.push(pts); G.guesses.push(guessM);
  if(G.mode==="daily"){ G.round++; saveDailyProg(false); G.round--; }
  $("guessarea").style.display="none"; $("revealarea").style.display="block"; showSrcLink();
  countUp($("altnum"),toUnit(actual));
  const err = guessM==null?t("timeout"):t("err")+" "+Math.abs(toUnit(actual)-toUnit(guessM)).toLocaleString()+" "+unit;
  $("cmparea").innerHTML=cmpBox(t("me"),guessM==null?"—":fmtH(guessM),err+" · +"+pts.toLocaleString()+t("pts"),true);
  $("nextmsg").textContent=t("next_in");
  sndReveal(pts>=3500);
  revealTimer=setTimeout(()=>{
    if(!G) return;
    G.locked=false; G.round++;
    if(G.mode==="daily"&&G.round>5) finishDaily();
    else soloRound();
  },3200);
}
const emOf=p=>p>=4500?"🟩":p>=3500?"🟨":p>=2000?"🟧":"🟥";
const cleanURL=()=>location.origin+location.pathname;
function showDailyResult(res,dn){
  cleanupGame();
  $("dailytitle").textContent=t("daily_title")+" #"+dn;
  $("dailyscore").textContent=res.s.toLocaleString();
  $("dailyemoji").textContent=res.p.map(emOf).join("");
  $("dailydetail").innerHTML=res.p.map((p,i)=>`${t("round")} ${i+1} — ${emOf(p)} ${p.toLocaleString()}${t("pts")}`).join("<br>");
  const st=dailyStreak();
  $("b-share-daily").onclick=()=>share(STR[L].share_daily(dn,res.s,res.p.map(emOf).join(""))+(st>=2?"🔥 "+t("streak_n")(st)+"\n":"")+cleanURL()+"?c="+res.s+"&d="+dn);
  screen("daily-result"); showAd("daily"); adBetween("daily_done");
  $("dailyrank").style.display="none"; loadRank(dn,res.s);
}

/* ================= 1대1 대결 공통 UI ================= */
function battleUIBase(myNick,foeNick){
  $("hparea").style.display="block"; $("b-quitgame").style.display="none";
  $("myname").textContent=myNick; $("foename").textContent=foeNick;
  setHP(START_HP,START_HP);
  $("mymult").dataset.v=""; $("foemult").dataset.v=""; setMult(1,1);
}
function setHP(me,foe){
  $("myhp").style.width=Math.max(0,me/START_HP*100)+"%"; $("foehp").style.width=Math.max(0,foe/START_HP*100)+"%";
  $("myhpn").textContent=Math.max(0,me).toLocaleString(); $("foehpn").textContent=Math.max(0,foe).toLocaleString();
}
function battleRoundUI(r){
  $("roundtxt").textContent=t("round")+" "+r+" / 15";
  $("scoretxt").textContent="";
  $("multbadge").style.display="none";
}
const fmtM=m=>"×"+(+m).toString();
function setMult(me,foe){
  [["mymult",me],["foemult",foe]].forEach(([id,m])=>{
    const el=$(id); m=m||1;
    if(el.textContent!==fmtM(m)&&el.dataset.v){ el.classList.add("bump"); setTimeout(()=>el.classList.remove("bump"),300); }
    el.textContent=fmtM(m); el.dataset.v="1";
    el.className="mchip"+(m>=3?" fire":m>1?" hot":"")+(el.classList.contains("bump")?" bump":"");
  });
}
function multNote(me,foe){ return t("next_mult")+" "+t("me")+" "+fmtM(me||1)+" · "+t("foe")+" "+fmtM(foe||1); }
/* 비교 박스: 추측값 · 라운드 점수(+) · 공격/피해 */
function cmpBattle(who,guessM,actual,taken,dealt,usedMult){
  const guessStr = guessM==null||guessM<0 ? "—" : fmtH(guessM);
  const errStr = guessM==null||guessM<0 ? t("timeout") : t("err")+" "+Math.abs(toUnit(actual)-toUnit(guessM)).toLocaleString()+" "+unit;
  const line = dealt>0 ? `<div class="cmpdmg pts">⚔️ ${dealt.toLocaleString()} ${t("attack")} (${fmtM(usedMult||1)})</div>`
             : taken>0 ? `<div class="cmpdmg">-${taken.toLocaleString()} HP</div>`
             : `<div class="cmpdmg" style="color:var(--dim)">${t("tie")}</div>`;
  return `<div class="cmpbox"><div class="cmpwho">${esc(who)}</div><div class="cmpval">${guessStr}</div><div class="cmppts" style="color:var(--ice)">${errStr}</div>${line}</div>`;
}

/* --- 봇 대결 (오프라인) --- */
function startBotGame(){
  const myNick=localStorage.getItem("pk_nick")||nickname();
  const pool = L==="ko" ? BOTNAMES : BOTNAMES.filter(n=>!/[가-힣]/.test(n)).concat(["SkylineFox","TowerOwl","SpireHunter","Rascacielos","Arranha-Céu","TurmFalke","TourEiffelFan","Tokyo_Tower"]);
  const foe=pool[Math.floor(Math.random()*pool.length)];
  G={mode:"bot",fb:false,round:1,myHP:START_HP,foeHP:START_HP,myMult:1,foeMult:1,foeNick:foe,
     mts:pickBalancedSeeded(Math.floor(Math.random()*1e9),15)};
  preloadPhotos(G.mts.map(i=>MT[i]));
  battleUIBase(myNick,foe); screen("game"); botRound();
}
function botRound(){
  const m=MT[G.mts[G.round-1]];
  battleRoundUI(G.round); setMult(G.myMult,G.foeMult);
  G.myGuess=undefined; G.deadline=now()+60000;
  const shown=showMountain(m);
  // 봇: 실제높이 ±(10~40%) 추측 (약간 약하게)
  const e=(0.10+Math.random()*0.30)*(Math.random()<.5?-1:1);
  G.botGuess=Math.max(1,Math.round(m[2]*(1+e)));
  startTimerWhenShown(shown,()=>{ if(G&&G.myGuess===undefined) botSubmit(null); });
}
function botSubmit(raw){
  if(!G||G.myGuess!==undefined)return;
  G.myGuess = raw==null?null:fromUnit(raw);
  $("guess").disabled=true;$("b-submit").disabled=true;
  $("waitmsg").textContent=t("submit_done");
  const wait=Math.max(0, (4000+Math.random()*7000)-(15000-(G.deadline-now())));
  revealTimer=setTimeout(()=>botReveal(),Math.min(wait, Math.max(0,G.deadline-now())));
}
function botReveal(){
  if(!G) return;
  cancelAnimationFrame(timerRAF);
  const m=MT[G.mts[G.round-1]],actual=m[2];
  const eMe=errOf(G.myGuess,actual), eFoe=errOf(G.botGuess,actual);
  const d=resolveRound(eMe,eFoe,G.myMult,G.foeMult);
  G.myHP-=d.a; G.foeHP-=d.b; G.myMult=d.mA; G.foeMult=d.mB;
  $("guessarea").style.display="none"; $("revealarea").style.display="block";
  countUp($("altnum"),toUnit(actual)); setHP(G.myHP,G.foeHP);
  $("cmparea").innerHTML =
    cmpBattle(t("me"),G.myGuess,actual,d.a,d.b,d.usedA) +
    cmpBattle(G.foeNick,G.botGuess,actual,d.b,d.a,d.usedB);
  setMult(G.myMult,G.foeMult); showSrcLink();
  sndReveal(eMe<=eFoe);
  const dead=G.myHP<=0||G.foeHP<=0, last=G.round>=15;
  $("nextmsg").textContent = dead||last ? "" : multNote(G.myMult,G.foeMult);
  revealTimer=setTimeout(()=>{
    if(!G) return;
    if(dead||last){ endBattle(G.myHP,G.foeHP,G.foeNick,false,"bot"); }
    else{ G.round++; botRound(); }
  },4200);
}

/* --- 결과 화면 (봇/온라인 공용) ---
   mode "bot": 다시 하기 = 새 봇전
   mode "net": 방을 유지한 채 재대결 대기 (G 유지) */
let lastBattleMode=null;
function endBattle(myHP,foeHP,foeNick,walkover,mode){
  lastBattleMode=mode;
  if(mode==="net"&&G){ cancelAnimationFrame(timerRAF); clearTimeout(revealTimer); G.phase="end"; }
  else cleanupGame();
  const win = walkover ? true : myHP>foeHP, draw=!walkover&&myHP===foeHP;
  $("restitle").textContent=draw?t("draw"):win?t("win"):t("lose");
  $("restitle").className="bigres "+(draw?"draw":win?"win":"lose");
  $("ressub").textContent=walkover?t("opp_left"):draw?t("draw_sub"):win?t("win_sub"):t("lose_sub");
  $("r-myname").textContent=localStorage.getItem("pk_nick");$("r-foename").textContent=foeNick;
  $("r-myhp").textContent="HP "+Math.max(0,myHP).toLocaleString();
  $("r-foehp").textContent="HP "+Math.max(0,foeHP).toLocaleString();
  const w=draw?t("draw"):win?t("win"):t("lose");
  $("b-share-battle").onclick=()=>share(STR[L].share_battle(w,localStorage.getItem("pk_nick"),foeNick)+cleanURL());
  // 재대결 버튼
  const rb=$("b-rematch");
  rb.disabled = walkover;   // 상대가 나간 경우 재대결 불가
  rb.textContent = mode==="bot" ? t("rematch_bot") : t("rematch");
  $("rematchmsg").textContent = walkover ? t("opp_gone") : "";
  draw?0:win?sndWin():sndLose();
  if(mode==="net") recordBattle(draw?"draws":win?"wins":"losses");
  screen("result"); showAd("result"); adBetween("battle_done");
}
$("b-rematch").onclick=()=>{
  if(lastBattleMode==="bot"){ cleanupGame(); startBotGame(); return; }
  if(G&&G.mode==="net"&&G.phase==="end"&&!G.foeLeft){
    set(ref(db,`rooms/${G.roomId}/rematch/${uid}`),true).catch(()=>{});
    $("b-rematch").disabled=true; $("rematchmsg").textContent=t("rematch_wait");
  }
};

/* ================= 온라인 공통 ================= */
const CODE=()=> Array.from({length:5},()=>"ABCDEFGHJKLMNPQRSTUVWXYZ23456789"[Math.floor(Math.random()*32)]).join("");
const ROOMVER=()=>window.MOUNTAINS_VERSION*100+APP_VER;   // 데이터·규칙이 같은 사람끼리만 매칭

/* ---------- 빠른 매칭 ----------
   전 세계 공용 대기 슬롯 1개(queue/_slot)를 트랜잭션으로 다룸.
   - 슬롯이 비었거나 오래됐으면 → 내가 대기자로 들어감
   - 다른 사람이 대기 중이면   → 그 사람을 꺼내고 내가 방장이 됨
   Firebase 트랜잭션은 첫 실행 때 로컬값(대개 빈 값)으로 돌기 때문에,
   빈 값에서 '중단'하지 않고 항상 값을 반환해야 서버값으로 재실행됨 (이전 버전의 매칭 실패 원인) */
const SLOT=()=>ref(db,"queue/_slot");
/* 1시간 넘게 방치된 방 청소 (둘 다 창을 닫아 남은 방) — 한 번에 최대 10개 */
let lastSweep=0;
function sweepOldRooms(){
  if(Date.now()-lastSweep<600000) return; lastSweep=Date.now();
  get(query(ref(db,"rooms"),orderByChild("created"),endAt(now()-3600000),limitToFirst(10)))
    .then(s=>s.forEach(c=>{ remove(c.ref).catch(()=>{}); })).catch(()=>{});
}
const SLOT_FRESH=35000;
async function quickMatch(startTs){
  if(!await ensureNick(true)) return;
  const n=nickname();
  sweepOldRooms();
  startTs=startTs||Date.now();
  cleanupGame();
  $("waittitle").textContent=t("matching"); $("waitdesc").textContent=t("matching_desc");
  $("roomcodebox").style.display="none"; $("b-copycode").style.display="none"; $("b-invite").style.display="none";
  screen("wait");
  const me={mode:"net",fb:true,phase:"matching",matching:true,startTs};
  G=me;
  try{
    // 지난 세션의 초대장 찌꺼기 제거
    await remove(ref(db,"invites/"+uid));
    let opp=null;
    const res=await runTransaction(SLOT(),cur=>{
      opp=null;
      const fresh=cur&&cur.uid&&cur.v===ROOMVER()&&(now()-(cur.ts||0)<SLOT_FRESH);
      if(fresh&&cur.uid!==uid){ opp={uid:cur.uid,nick:cur.nick}; return null; } // 대기자 꺼내기
      return {uid,nick:n,ts:now(),v:ROOMVER()};                                // 내가 대기
    });
    if(G!==me) return;                      // 그 사이 취소됨
    if(!res.committed) throw new Error("tx");
    if(opp){                                // ▶ 방장: 방 만들고 초대
      me.matching=false;
      const roomId=CODE();
      await createRoom(roomId,n,true);
      if(G!==me){ remove(ref(db,"rooms/"+roomId)).catch(()=>{}); return; }
      await set(ref(db,"invites/"+opp.uid),{room:roomId,ts:now()});
      enterRoom(roomId,true,{quick:true,startTs});
      return;
    }
    // ▶ 대기자: 초대장 기다리기
    me.slotMine=true;
    onDisconnect(SLOT()).remove();
    const invRef=ref(db,"invites/"+uid);
    onValue(invRef,async s=>{
      if(G!==me||!s.exists()) return;
      const inv=s.val(); if(!inv||!inv.room||now()-(inv.ts||0)>20000) return;
      off(invRef); remove(invRef).catch(()=>{});
      onDisconnect(SLOT()).cancel(); me.slotMine=false; me.matching=false;
      clearTimeout(matchTimer);
      await joinQuickRoom(inv.room,n,me,startTs);
    });
    unsub.push(()=>off(invRef));
    const left=Math.max(3000,30000-(Date.now()-startTs));
    matchTimer=setTimeout(()=>giveUpWaiting(me,invRef),left);
  }catch(e){
    if(G===me){ cleanupGame(); startBotGame(); }
  }
}
async function giveUpWaiting(me,invRef){
  if(G!==me) return;
  // 슬롯이 아직 내 것이면 비우고 봇전. 이미 누가 꺼내갔다면(초대장 오는 중) 조금 더 기다림
  let stillMine=false;
  try{
    await runTransaction(SLOT(),cur=>{ stillMine=!!(cur&&cur.uid===uid); return stillMine?null:cur; });
  }catch(e){ stillMine=true; }
  if(G!==me) return;
  onDisconnect(SLOT()).cancel(); me.slotMine=false;
  if(stillMine){ off(invRef); cleanupGame(); startBotGame(); }
  else matchTimer=setTimeout(()=>{ if(G===me){ off(invRef); cleanupGame(); startBotGame(); } },8000);
}
async function joinQuickRoom(roomId,n,me,startTs){
  const s=await get(ref(db,"rooms/"+roomId));
  if(G!==me) return;
  if(!s.exists()||s.val().ver!==ROOMVER()){ quickMatch(startTs); return; }
  await update(ref(db,`rooms/${roomId}`),{[`members/${AUID}`]:true,[`players/${uid}`]:{nick:n,hp:START_HP}});
  onDisconnect(ref(db,`rooms/${roomId}/players/${uid}/left`)).set(true);
  if(G!==me) return;
  enterRoom(roomId,false,{quick:true,startTs});
}

/* ---------- 친구 방 ---------- */
async function createRoom(roomId,nick,quick){
  await set(ref(db,"rooms/"+roomId),{
    created:now(), host:uid, ver:ROOMVER(), quick:!!quick, game:1,
    mts:pickBalancedSeeded(Math.floor(Math.random()*1e9),15),
    members:{[AUID]:true},
    players:{[uid]:{nick,hp:START_HP}},
    state:{phase:"lobby",round:0}
  });
  onDisconnect(ref(db,`rooms/${roomId}/players/${uid}/left`)).set(true);
}
async function createFriendRoom(){
  if(!await ensureNick(true)) return;
  const n=nickname();
  cleanupGame();
  const roomId=CODE();
  await createRoom(roomId,n,false);
  $("waittitle").textContent=t("room_wait"); $("waitdesc").textContent=t("room_desc");
  $("roomcodebox").style.display="block"; $("roomcodebox").textContent=roomId;
  $("b-copycode").style.display="block";
  $("b-copycode").onclick=()=>{navigator.clipboard.writeText(roomId).then(()=>toast(t("copied")));};
  $("b-invite").style.display="block"; $("b-invite").textContent=t("invite_copy");
  $("b-invite").onclick=()=>share(t("invite_text")(roomId)+"\n"+cleanURL()+"?room="+roomId);
  screen("wait");
  enterRoom(roomId,true,{});
}
async function joinRoom(){
  if(!await ensureNick(true)) return;
  const n=nickname();
  const roomId=($("joincode").value||"").trim().toUpperCase();
  const s=await get(ref(db,"rooms/"+roomId));
  if(!s.exists()){toast(t("no_room"));return;}
  const room=s.val();
  const active=Object.values(room.players||{}).filter(p=>!p.left);
  if(active.length>=2){toast(t("room_full"));return;}
  if(room.ver!==ROOMVER()){toast(t("version_err"));return;}
  cleanupGame();
  await update(ref(db,`rooms/${roomId}`),{[`members/${AUID}`]:true,[`players/${uid}`]:{nick:n,hp:START_HP}});
  onDisconnect(ref(db,`rooms/${roomId}/players/${uid}/left`)).set(true);
  enterRoom(roomId,false,{});
}

/* ---------- 방 진행 (로비 → 라운드 → 결과 → 재대결) ---------- */
function enterRoom(roomId,iAmHost,opts){
  opts=opts||{};
  const me0={mode:"net",fb:true,roomId,iAmHost,roomRef:ref(db,"rooms/"+roomId),
             phase:"lobby",shownRound:0,hostActing:iAmHost,game:undefined};
  G=me0;
  const rref=me0.roomRef;
  // 빠른매칭 방장: 상대가 8초 안에 안 들어오면(유령 대기자) 방 지우고 다시 매칭
  if(opts.quick&&iAmHost){
    me0.joinTimer=setTimeout(()=>{
      if(G===me0&&me0.phase==="lobby"&&!me0.foeUid){ toast(t("join_fail")); quickMatch(opts.startTs); }
    },8000);
  }
  onValue(rref,snap=>{
    if(G!==me0) return;
    if(!snap.exists()){
      if(me0.phase==="end"){ me0.foeLeft=true; $("b-rematch").disabled=true; $("rematchmsg").textContent=t("opp_gone"); }
      else { cleanupGame(); screen("home"); }
      return;
    }
    const room=snap.val();
    if(room.mts&&me0.preloadedFor!==room.game){ me0.preloadedFor=room.game; preloadPhotos(room.mts.map(i=>MT[i])); }
    const players=room.players||{};
    const foeUid=Object.keys(players).find(k=>k!==uid);
    const me=players[uid], foe=foeUid?players[foeUid]:null;
    if(!me) return;
    me0.foeUid=foeUid; me0.foeLeft=!!(foe&&foe.left);

    // 재대결로 새 판이 시작됐는지 감지 → 로컬 상태 초기화
    const gameNo=room.game||1;
    if(me0.game===undefined) me0.game=gameNo;
    else if(gameNo!==me0.game){
      me0.game=gameNo; me0.phase="lobby"; me0.shownRound=0; me0.submitted=false;
      me0.advancing=false; me0.resetting=false;
      $("b-rematch").disabled=false; $("rematchmsg").textContent="";
    }

    // 결과 화면에서: 상대 이탈/재대결 요청 처리
    if(me0.phase==="end"){
      if(me0.foeLeft){ $("b-rematch").disabled=true; $("rematchmsg").textContent=t("opp_gone"); return; }
      const rm=room.rematch||{};
      if(rm[uid]&&foeUid&&rm[foeUid]){ if(room.host===uid||me0.hostActing) hostRematch(room); }
      else if(foeUid&&rm[foeUid]&&!rm[uid]) $("rematchmsg").textContent=t("rematch_req");
      return;
    }

    // 대전 중 상대 이탈 → 부전승
    if(foe&&foe.left&&room.state.phase!=="end"&&room.state.phase!=="lobby"){
      endBattle(me.hp,foe.hp,foe.nick,true,"net");
      return;
    }
    if(room.host!==uid && players[room.host] && players[room.host].left) me0.hostActing=true;
    if(room.host===uid) me0.hostActing=true;

    if(room.state.phase==="lobby"){
      if(foe && !foe.left && me0.hostActing && !me0.startSent){
        me0.startSent=true; clearTimeout(me0.joinTimer);
        update(ref(db,`rooms/${roomId}/state`),{phase:"guess",round:1,deadline:now()+16000});
      }
      return;
    }
    clearTimeout(me0.joinTimer);
    if(room.state.phase==="guess") netGuessPhase(room,me,foe);
    if(room.state.phase==="reveal") netRevealPhase(room,me,foe);
    if(room.state.phase==="end"){
      endBattle(me.hp,foe?foe.hp:0,foe?foe.nick:"?",false,"net");
    }
  });
  unsub.push(()=>off(rref));
}
async function hostRematch(room){
  if(!G||G.resetting) return; G.resetting=true;
  const upd={
    mts:pickBalancedSeeded(Math.floor(Math.random()*1e9),15),
    guesses:null, rematch:null, game:(room.game||1)+1,
    state:{phase:"guess",round:1,deadline:now()+16000}
  };
  Object.keys(room.players).forEach(u=>{
    upd[`players/${u}/hp`]=START_HP;
    ["lastG","lastE","lastD","lastA","lastM","mult"].forEach(k=>upd[`players/${u}/${k}`]=null);
  });
  try{ await update(G.roomRef,upd); }catch(e){ if(G) G.resetting=false; }
}

function netGuessPhase(room,me,foe){
  const r=room.state.round;
  if(G.shownRound!==r){
    G.shownRound=r; G.submitted=false; G.phase="guess";
    if(r===1) battleUIBase(me.nick,foe?foe.nick:"…");
    battleRoundUI(r); setHP(me.hp,foe?foe.hp:START_HP); setMult(me.mult,foe?foe.mult:1);
    showMountain(MT[room.mts[r-1]]); if(r===1)toast(t("start_in"));
    screen("game");
  }
  G.phase="guess";
  const g0=G;
  runTimer(room.state.deadline,()=>{
    if(G!==g0) return;
    if(!G.submitted) netSubmit(null,room);
    if(G.hostActing) hostAdvance();
  });
  const gs=(room.guesses||{})["r"+r]||{};
  if(G.hostActing && G.foeUid && gs[uid]!==undefined && gs[G.foeUid]!==undefined) hostAdvance();
}
async function netSubmit(raw,roomSnap){
  if(!G||G.submitted)return; G.submitted=true;
  $("guess").disabled=true;$("b-submit").disabled=true;
  $("waitmsg").textContent=t("submit_done");
  const room=roomSnap|| (await get(G.roomRef)).val(); if(!room||!G)return;
  const v = raw==null ? -1 : fromUnit(raw);
  await set(ref(db,`rooms/${G.roomId}/guesses/r${room.state.round}/${uid}`),v);
}
async function hostAdvance(){
  if(!G||G.advancing)return; G.advancing=true;
  const g0=G;
  try{
    const room=(await get(g0.roomRef)).val(); if(!room||room.state.phase!=="guess"){g0.advancing=false;return;}
    const r=room.state.round, gs=(room.guesses||{})["r"+r]||{};
    const uids=Object.keys(room.players).filter(u=>!room.players[u].left);
    const allIn=uids.every(u=>gs[u]!==undefined);
    if(!allIn && now()<room.state.deadline+600){g0.advancing=false;return;}
    const actual=MT[room.mts[r-1]][2];
    const sc={}; uids.forEach(u=>{ const g=gs[u]===undefined||gs[u]<0?null:gs[u]; sc[u]={g,e:errOf(g,actual)}; });
    const upd={};
    if(uids.length===2){
      const [a,b]=uids, d=resolveRound(sc[a].e,sc[b].e,room.players[a].mult||1,room.players[b].mult||1);
      upd[`players/${a}/hp`]=room.players[a].hp-d.a; upd[`players/${a}/lastD`]=d.a; upd[`players/${a}/lastA`]=d.b;
      upd[`players/${b}/hp`]=room.players[b].hp-d.b; upd[`players/${b}/lastD`]=d.b; upd[`players/${b}/lastA`]=d.a;
      upd[`players/${a}/lastM`]=d.usedA; upd[`players/${a}/mult`]=d.mA;
      upd[`players/${b}/lastM`]=d.usedB; upd[`players/${b}/mult`]=d.mB;
    }
    uids.forEach(u=>{ upd[`players/${u}/lastG`]=sc[u].g===null?-1:sc[u].g; upd[`players/${u}/lastE`]=sc[u].e; });
    upd["state/phase"]="reveal"; upd["state/until"]=now()+4500;
    await update(g0.roomRef,upd);
    setTimeout(async()=>{
      try{
        const cur=(await get(g0.roomRef)).val();
        if(!cur||cur.state.phase!=="reveal"||cur.state.round!==r){g0.advancing=false;return;}
        const hs=Object.values(cur.players).filter(p=>!p.left).map(p=>p.hp);
        const dead=hs.some(h=>h<=0), last=r>=15;
        if(dead||last) await update(ref(db,`rooms/${g0.roomId}/state`),{phase:"end"});
        else await update(ref(db,`rooms/${g0.roomId}/state`),{phase:"guess",round:r+1,deadline:now()+15600});
      }catch(e){}
      g0.advancing=false;
    },4600);
  }catch(e){g0.advancing=false;}
}
function netRevealPhase(room,me,foe){
  if(G.phase==="reveal"||!foe)return; G.phase="reveal";
  cancelAnimationFrame(timerRAF);
  const actual=MT[room.mts[room.state.round-1]][2];
  $("guessarea").style.display="none"; $("revealarea").style.display="block";
  countUp($("altnum"),toUnit(actual)); setHP(me.hp,foe.hp);
  $("cmparea").innerHTML =
    cmpBattle(t("me"),me.lastG,actual,me.lastD||0,me.lastA||0,me.lastM) +
    cmpBattle(foe.nick,foe.lastG,actual,foe.lastD||0,foe.lastA||0,foe.lastM);
  setMult(me.mult,foe.mult); showSrcLink();
  $("nextmsg").textContent=multNote(me.mult,foe.mult);
  sndReveal((me.lastE||0)<=(foe.lastE||0));
  const g0=G;
  setTimeout(()=>{ if(G===g0&&G.phase==="reveal") G.phase="idle"; },4300);
}

/* ================= 광고 =================
   AdSense 승인 전에는 아무것도 하지 않음. 승인 후 ADS.client 와 슬롯 번호만 넣으면 켜짐.
   - 배너: 홈 아래, 데일리 결과, 대결 결과 (플레이 중에는 절대 표시 안 함)
   - 전면 광고(H5 Games Ads): 판이 끝난 뒤에만 (ADS.h5 = true 일 때) */
const ADS = { client:"", h5:false, slots:{ home:"", daily:"", result:"" } };
let adsLoaded=false;
function loadAdsScript(){
  if(adsLoaded || !ADS.client) return; adsLoaded=true;
  const sc=document.createElement("script"); sc.async=true; sc.crossOrigin="anonymous";
  sc.src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client="+encodeURIComponent(ADS.client);
  if(ADS.h5){ sc.dataset.adFrequencyHint="60s"; }
  document.head.appendChild(sc);
  window.adsbygoogle=window.adsbygoogle||[];
  if(ADS.h5){ window.adBreak=window.adConfig=function(o){ window.adsbygoogle.push(o); }; window.adConfig({preloadAdBreaks:"on"}); }
}
function showAd(where){
  const slot=ADS.slots[where], box=$("ad-"+where);
  if(!ADS.client || !slot || !box || box.dataset.done) return;
  loadAdsScript(); box.dataset.done="1";
  box.innerHTML=`<ins class="adsbygoogle" style="display:block" data-ad-client="${esc(ADS.client)}" data-ad-slot="${esc(slot)}" data-ad-format="auto" data-full-width-responsive="true"></ins>`;
  try{ (window.adsbygoogle=window.adsbygoogle||[]).push({}); }catch(e){}
}
function adBetween(name){ if(ADS.client && ADS.h5 && window.adBreak) try{ window.adBreak({type:"next",name}); }catch(e){} }

    c.width=innerWidth;c.height=innerHeight;x.fillStyle="rgba(242,246,249,.8)";

})();
