# 게임 포털(CrazyGames)용 zip 만들기 → Releases 의 'portal-latest' 에 올려 둠 (수형 님이 내려받아 포털에 업로드)
name: Portal build

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/build_portal.py crazygames
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view portal-latest >/dev/null 2>&1 || gh release create portal-latest --prerelease --title "Portal build (CrazyGames)" --notes "CrazyGames 개발자 포털에 올릴 zip 파일"
          gh release upload portal-latest dist/peakle-crazygames.zip --clobber
