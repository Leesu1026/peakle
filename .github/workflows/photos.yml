# 사진 내려받기 + 촬영자·라이선스 수집 (위키미디어 → img/, photos.js)
# mountains.js 가 바뀌거나, Actions 화면에서 직접 실행하면 돌아감
name: Photos

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - mountains.js
      - tools/fetch_photos.py
      - .github/workflows/photos.yml

permissions:
  contents: write

concurrency:
  group: photos
  cancel-in-progress: false

jobs:
  photos:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow requests
      - run: python tools/fetch_photos.py
      - name: Commit results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add img photos.js || true
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git commit -m "사진·출처 자동 갱신"
          git push
